<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAMERPRO GAME</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <main id="game">

        <!-- ============================= -->
        <!-- 🎬 INICIO -->
        <!-- ============================= -->

        <div id="inicio">

            <img
                src="./1.jpg"
                alt="GAMERPRO GAME"
            >

            <!-- ⚠️ NO CAMBIAR POSICIÓN -->
            <button
                id="playButton"
                type="button"
                aria-label="Jugar"
            ></button>

        </div>


        <!-- ============================= -->
        <!-- 🌎 MUNDO 3D -->
        <!-- ============================= -->

        <div
            id="mundo3D"
            style="display: none;"
        ></div>


        <!-- ============================= -->
        <!-- 🐔 GALLINERO -->
        <!-- ============================= -->

        <div
            id="gallinero"
            style="display: none;"
        ></div>

    </main>


    <!-- ============================= -->
    <!-- 🎮 GAME.JS -->
    <!-- ============================= -->

    <script
        type="module"
        src="./game.js"
    ></script>

</body>

</html>
